# ============================================================================
# Ostris AI-Toolkit Configuration: Wan 2.1 I2V 14B 480p (FlowMatch Video)
# Calibrated for: NVIDIA RTX 4090 (24GB VRAM)
# Strategy: FP8 quantization + low_vram offloading, EMA enabled (0.99),
#           and conservative LR (5e-5) for temporal/style consistency.
# ============================================================================

job: extension
config:
  name: TRIGGER_WAN
  process:
  - type: diffusion_trainer
    training_folder: ./output
    sqlite_db_path: ./aitk_db.db
    device: cuda
    trigger_word: TRIGGER
    performance_log_every: 10

    network:
      type: lora
      linear: 32
      linear_alpha: 32
      conv: 16
      conv_alpha: 16
      lokr_full_rank: true
      lokr_factor: -1
      network_kwargs:
        ignore_if_contains: []

    save:
      dtype: bf16
      save_every: 250
      max_step_saves_to_keep: 4
      save_format: diffusers
      push_to_hub: false

    datasets:
    - folder_path: ./datasets/trigger_WAN
      mask_path: null
      mask_min_value: 0.1
      default_caption: ''
      caption_ext: txt
      caption_dropout_rate: 0.05
      cache_latents_to_disk: false
      is_reg: false
      network_weight: 1
      resolution:
      - 480
      controls: []
      shrink_video_to_frames: true
      num_frames: 1
      flip_x: false
      flip_y: false
      num_repeats: 1
      fps: 16

    train:
      batch_size: 1
      bypass_guidance_embedding: false
      steps: 3000
      gradient_accumulation: 1
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      optimizer: adamw8bit
      timestep_type: sigmoid
      content_or_style: style
      optimizer_params:
        weight_decay: 0.01
      unload_text_encoder: false
      cache_text_embeddings: true
      lr: 5.0e-05
      ema_config:
        use_ema: true
        ema_decay: 0.99
      skip_first_sample: true
      force_first_sample: false
      disable_sampling: true
      dtype: bf16
      diff_output_preservation: false
      diff_output_preservation_multiplier: 1
      diff_output_preservation_class: person
      switch_boundary_every: 20
      loss_type: mse

    logging:
      log_every: 1
      use_ui_logger: true

    model:
      name_or_path: Wan-AI/Wan2.1-I2V-14B-480P-Diffusers
      quantize: true
      qtype: qfloat8
      quantize_te: false
      qtype_te: qfloat8
      arch: wan21_i2v:14b480p
      low_vram: true
      model_kwargs: {}
      compile: false

    sample:
      sampler: flowmatch
      sample_every: 250
      sample_start_step: 0
      width: 1024
      height: 1024
      samples: []
      neg: ''
      seed: 42
      walk_seed: true
      guidance_scale: 4
      sample_steps: 30
      num_frames: 41
      fps: 16

meta:
  name: TRIGGER_WAN
  version: '1.0'